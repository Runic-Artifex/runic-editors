name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Merge queue entries, if the repository enables a merge queue; `verify` is the required check.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its running CI; pushes to main and merge queue entries each keep their run.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.cache/nuget

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # The release scripts' tests also evaluate the Visual Studio project's version stamping with `dotnet msbuild`.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Test the version mapping and release scripts
        run: bun test eng
      - name: Check the runic.json schema against the pinned Translations release
        run: bun eng/translations.mjs --check
      - name: Check the Visual Studio source manifest
        run: python3 visualstudio/package.py --check-source

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # The host test runs `dotnet tool run runic-translations -- lsp` like a user's workspace.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Packaging stamps the eng/version.json release version (eng/release/ide-versions.mjs) and checks the VSIX.
      # The second package (not uploaded) checks that a plain release drops the pre-release flag and keeps the Preview label.
      - name: Build, test and package the VS Code extension
        working-directory: vscode
        run: |
          bun install --frozen-lockfile
          bun run --bun check
          bun run --bun test
          bun run package
          node package.mjs 0.8.0 "$RUNNER_TEMP/final-release-check.vsix"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-vsix
          path: vscode/artifacts/runic-translations.vsix
          if-no-files-found: error
          # The release workflow takes the VSIX from the CI run of the released commit.
          retention-days: 30
      # The language server is the dotnet-runic-translations release in .config/dotnet-tools.json, restored from NuGet.
      - name: Restore the language server
        run: dotnet tool restore
      - name: Download VS Code for the host test
        env:
          VSCODE_VERSION: 1.146.0
          VSCODE_SHA256: cbdb7bde3d358c7297cf1d9d6adc16dfb1d0179501fb2c152df48593e39e3600
        run: |
          archive="$RUNNER_TEMP/vscode.tar.gz"
          curl -fsSL -o "$archive" "https://update.code.visualstudio.com/$VSCODE_VERSION/linux-x64/stable"
          echo "$VSCODE_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "VSCODE_EXECUTABLE_PATH=$RUNNER_TEMP/VSCode-linux-x64/bin/code" >> "$GITHUB_ENV"
      - name: Run the extension-host test against the language server
        working-directory: vscode
        run: xvfb-run -a bun run test:host
      - name: Retain the host test profile
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-host-failure
          path: vscode/artifacts/host-failure
          if-no-files-found: ignore

  visualstudio:
    name: Visual Studio extension
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      # The project stamps the VSIX version from eng/version.json; package.py checks it.
      - name: Build the VSIX with full-framework MSBuild
        run: msbuild visualstudio/Runic.Translations.VisualStudio.csproj /restore /m:1 /p:Configuration=Release /p:RestoreLockedMode=true
      - name: Verify the VSIX against the source manifest
        run: python visualstudio/package.py --configuration Release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visualstudio-vsix
          path: visualstudio/artifacts/runic-translations-visualstudio.vsix
          if-no-files-found: error
          retention-days: 30

  verify:
    name: verify
    if: always()
    needs: [source-checks, vscode, visualstudio]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          IFS=',' read -ra results <<< "$RESULTS"
          for result in "${results[@]}"; do
            if [[ "$result" != success ]]; then
              echo "Verification is incomplete: $RESULTS"
              exit 1
            fi
          done
