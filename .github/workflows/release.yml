name: Release

# Draft (runic-editors#1): releases the two VSIX files that CI built for a commit on main as a GitHub release with
# SHA256SUMS and build-provenance attestations. Nothing is published to an extension marketplace (D066.25 #4).
# Dispatch-only and a dry run by default; see eng/release/README.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version (eng/version.json), a plain x.y.z before 1.0, or x.y.z-preview.N / x.y.z-rc.N (1-499)
        required: true
        type: string
      dry-run:
        description: Check the CI artifacts, tag and release without creating anything
        required: false
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Read-only: finds the successful CI push run for this commit, verifies both VSIX files and checks tag and release.
  # A dry run ends here; this job never holds OIDC, attestation or write permissions.
  candidate:
    if: github.repository == 'Runic-Artifex/runic-editors' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      ci-run-id: ${{ steps.ci.outputs.run-id }}
      vsix-artifact-ids: ${{ steps.ci.outputs.vsix-artifact-ids }}
      # sha256sum lines of the candidate files; publish checks its download against them.
      release-sha256: ${{ steps.prepare.outputs.sha256 }}
    env:
      # Pass the dispatch input through the environment, never into script text.
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          version="$VERSION"
          # The IDE extension versions cannot express another prerelease label, so CI never packages one
          # (eng/release/ide-versions.mjs, the same pattern).
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(preview|rc)\.([1-9][0-9]?|[1-4][0-9]{2}))?$ ]]; then
            echo "::error::Version '$version' is not a plain x.y.z, x.y.z-preview.N or x.y.z-rc.N (1 <= N <= 499); IDE extension packaging rejects every other version, so CI cannot have built it."
            exit 1
          fi
          # Also enforces the 65534 component limit and prints the IDE versions this release maps to.
          bun eng/release/ide-versions.mjs "$version"
          test "$version" = "$(jq -r .version eng/version.json)"
      - name: Find the successful CI run for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun eng/release/release.mjs find-ci
      # Each VSIX artifact is extracted into artifacts/vsix/<artifact name>.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.ci.outputs.vsix-artifact-ids }}
          path: artifacts/vsix
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Verify the VSIX files against the version and write SHA256SUMS
        id: prepare
        env:
          CI_RUN_ID: ${{ steps.ci.outputs.run-id }}
        run: |
          bun eng/release/release.mjs prepare artifacts/vsix "$VERSION" "$CI_RUN_ID" artifacts/release
          cat artifacts/release/SHA256SUMS
          {
            echo 'sha256<<SHA256'
            (cd artifacts/release && sha256sum -- *)
            echo SHA256
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Check tag and release without creating them
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun eng/release/release.mjs release-check "$VERSION"

  publish:
    needs: candidate
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Create this environment (with required reviewers) before the first real release.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.candidate.outputs.vsix-artifact-ids }}
          path: artifacts/vsix
          run-id: ${{ needs.candidate.outputs.ci-run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: artifacts/release
      - name: Check the candidate files against the candidate job
        working-directory: artifacts/release
        env:
          RELEASE_SHA256: ${{ needs.candidate.outputs.release-sha256 }}
        run: |
          test -n "$RELEASE_SHA256"
          printf '%s\n' "$RELEASE_SHA256" | sha256sum --check --strict
      - name: Verify the VSIX files against the candidate inventory
        env:
          CI_RUN_ID: ${{ needs.candidate.outputs.ci-run-id }}
        run: bun eng/release/release.mjs verify artifacts/vsix artifacts/release/candidate.json "$VERSION" "$CI_RUN_ID"
      # Attest the verified bytes before the release is created.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/vsix/*/*.vsix
            artifacts/release/SHA256SUMS
      # A prerelease for 0.y.z and every x.y.z-rc.N / -preview.N; a stable version from 1.0.0 is a full release.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun eng/release/release.mjs release "$VERSION" artifacts/vsix artifacts/release/SHA256SUMS
